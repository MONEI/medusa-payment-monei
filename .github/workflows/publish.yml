name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Check tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          actual="v$(jq -r .version package.json)"
          if [ "$actual" != "$TAG" ]; then
            echo "package.json has $actual, release tag is $TAG"
            exit 1
          fi

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # prepublishOnly builds .medusa/server. Trusted publishing: npm exchanges
      # the OIDC token, so no NPM_TOKEN secret is needed.
      - name: Publish
        run: npm publish
